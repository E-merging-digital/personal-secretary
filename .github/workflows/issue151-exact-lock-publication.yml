name: Issue 151 exact lock publication

on:
  push:
    branches:
      - 'work/issue-151-local-ai-quick-capture-spike'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout temporary publication commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Rebuild exact local candidate patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .issue151.patch.b64 | gzip -d > /tmp/issue151.patch
          test "$(sha256sum /tmp/issue151.patch | cut -d' ' -f1)" = "9dea6073841dc2f4735e2fed7d89bd6ee58a08aaa0a447a05fe5248965c60419"
          git apply --index /tmp/issue151.patch
          test "$(git hash-object composer.json)" = "9d8240d4e7c3e30fcbd05ae22ef698350325235f"

      - name: Set up DDEV
        uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: false
          version: 1.25.4

      - name: Reproduce exact Composer lock in canonical runtime
        shell: bash
        run: |
          set -euo pipefail
          ddev start
          ddev composer require 'drupal/ai:^1.4' 'drupal/ai_provider_lmstudio:^1.1' --no-install --no-interaction --no-scripts
          test "$(git hash-object composer.json)" = "9d8240d4e7c3e30fcbd05ae22ef698350325235f"
          test "$(git hash-object composer.lock)" = "5323d996efd129435b55fe410a59b92b8562b6a6"

      - name: Publish only the exact validated tree
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/issue151-exact-lock-publication.yml .issue151.patch.b64
          git add composer.json composer.lock
          test "$(git write-tree)" = "bc665467d6bbd1a4bb39a0784b80ebce4cc9b048"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete local AI quick-capture spike'
          git push origin HEAD:work/issue-151-local-ai-quick-capture-spike
