name: Issue 60 materialize

on:
  push:
    branches:
      - "work/issue-60-config-language-lock"

permissions:
  contents: write

jobs:
  inspect-normalization:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v5
        with:
          ref: work/issue-60-config-language-lock

      - name: Assert bounded branch
        run: test "${GITHUB_REF_NAME}" = "work/issue-60-config-language-lock"

      - name: Set up DDEV
        uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: false
          version: 1.25.4

      - name: Start DDEV and install locked dependencies
        run: |
          ddev start
          ddev composer install --no-interaction --prefer-dist

      - name: Inspect actual normalization services and submit path
        run: |
          echo '=== services ==='
          cat web/modules/contrib/config_language_lock/config_language_lock.services.yml
          echo '=== settings form submit ==='
          sed -n '170,235p' web/modules/contrib/config_language_lock/src/Form/ConfigLanguageLockSettingsForm.php
          echo '=== batch ==='
          cat web/modules/contrib/config_language_lock/src/ConfigLanguageLockBatch.php
          echo '=== config manager ==='
          cat web/modules/contrib/config_language_lock/src/ConfigLanguageLockConfigManager.php
