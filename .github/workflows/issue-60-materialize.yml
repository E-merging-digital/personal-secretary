name: Issue 60 materialize

on:
  push:
    branches:
      - "work/issue-60-config-language-lock"

permissions:
  contents: write

jobs:
  materialize-config:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v5
        with:
          ref: work/issue-60-config-language-lock

      - name: Assert bounded branch
        run: test "${GITHUB_REF_NAME}" = "work/issue-60-config-language-lock"

      - name: Set up DDEV
        uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: false
          version: 1.25.4

      - name: Start DDEV and install locked dependencies
        run: |
          ddev start
          ddev composer install --no-interaction --prefer-dist
          ddev composer validate --strict
          ddev composer audit --locked

      - name: Bootstrap canonical development configuration
        run: ddev exec ./scripts/rebuild development

      - name: Enable and configure Configuration Language Lock
        run: |
          ddev drush en config_language_lock -y
          ddev drush cset config_language_lock.settings locked_langcode en -y
          ddev drush cset config_language_lock.settings follow_site_default false -y
          ddev drush php:eval '$manager = \Drupal::service("Drupal\\config_language_lock\\ConfigLanguageLockConfigManager"); $stats = $manager->updateConfigForLockedLanguageSwitch($manager->getComponentNames()); print "NORMALIZATION=" . json_encode($stats) . PHP_EOL; print "LANGCODES=" . json_encode($manager->countConfigItemsByLangcode()) . PHP_EOL;'
          test "$(ddev drush cget config_language_lock.settings locked_langcode --format=string)" = "en"
          test "$(ddev drush cget config_language_lock.settings follow_site_default --format=string)" = "false"
          test "$(ddev drush cget system.site default_langcode --format=string)" = "en"

      - name: Export canonical configuration
        run: |
          ddev drush cex -y
          echo '=== exported settings ==='
          cat config/sync/config_language_lock.settings.yml
          echo '=== module enablement ==='
          grep -nE 'config_language_lock|language:|locale:|config_translation:|content_translation:' config/sync/core.extension.yml || true
          echo '=== exported langcode distribution ==='
          grep -RhoE '^langcode: .+$' config/sync | sort | uniq -c || true
          echo '=== generated diff ==='
          git diff -- config/sync

      - name: Commit generated Drupal configuration only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/sync
          if git diff --cached --quiet; then
            echo 'No Drupal configuration change to commit.'
            exit 1
          fi
          git commit -m 'Lock repository configuration language to English (#60)'
          git push origin HEAD:work/issue-60-config-language-lock
