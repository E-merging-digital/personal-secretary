name: Date Recur Materialize

on:
  push:
    branches:
      - "work/issue-33-date-recur-runtime-spike"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch HEAD
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Set up DDEV
        uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: false
          version: 1.25.4

      - name: Start DDEV
        run: |
          ddev start
          ddev version

      - name: Resolve Date Recur through official Composer repositories
        run: |
          ddev composer update drupal/date_recur --with-all-dependencies --no-interaction --prefer-dist
          ddev composer validate --strict
          ddev composer audit --locked

      - name: Materialize Drupal configuration
        run: |
          ddev exec drush site:install minimal -y --site-name="Personal Secretary" --account-name=admin --account-pass=synthetic-ci-admin
          ddev exec drush pm:install config_split -y
          source_uuid="$(awk '/^uuid:/ {print $2; exit}' config/sync/system.site.yml)"
          test -n "${source_uuid}"
          ddev exec drush config:set system.site uuid "${source_uuid}" -y
          ddev exec drush config:import -y
          ddev exec drush pm:install date_recur -y
          ddev exec drush config:export -y
          grep -Eq '^[[:space:]]+date_recur:' config/sync/core.extension.yml
          ddev exec ./scripts/verify development

      - name: Restrict generated write set
        run: |
          mapfile -t changed < <(git status --porcelain=v1 --untracked-files=all | sed -E 's/^.. //')
          printf '%s\n' "${changed[@]}"
          for path in "${changed[@]}"; do
            case "${path}" in
              composer.lock|config/sync/*) ;;
              *)
                echo "Unexpected generated path: ${path}" >&2
                exit 1
                ;;
            esac
          done
          test -n "${changed[*]}"

      - name: Commit deterministic generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock config/sync
          git diff --cached --check
          git commit -m "Materialize date_recur lock and configuration (#33)"
          git push origin HEAD:${{ github.ref_name }}
