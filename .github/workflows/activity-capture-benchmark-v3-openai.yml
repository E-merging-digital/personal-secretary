name: Activity Capture Benchmark V3 OpenAI

on:
  workflow_dispatch:
    inputs:
      ministral_final_correct:
        description: Frozen Ministral V3 final product outcomes correct (0-20)
        required: true
        type: string

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    environment: benchmark-openai
    steps:
      - name: Checkout exact dispatched head
        uses: actions/checkout@v5

      - name: Assert bounded branch and frozen fixture
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "work/issue-170-activity-capture-benchmark-v3"
          test "$(sha256sum web/modules/custom/personal_secretary/tests/fixtures/activity_capture_benchmark_v3.json | awk '{print $1}')" = "bb31e0ba98db688adcdfd530275bf3aff47013c79d4c6bb2c4896b1477cc8cbd"
          test "$(git status --porcelain)" = ""

      - name: Validate Ministral outcome input
        shell: bash
        env:
          MINISTRAL_FINAL_CORRECT: ${{ inputs.ministral_final_correct }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          value=int(os.environ["MINISTRAL_FINAL_CORRECT"])
          if value < 0 or value > 20:
              raise SystemExit("MINISTRAL_FINAL_CORRECT_OUT_OF_RANGE")
          print(f"MINISTRAL_FINAL_CORRECT={value}")
          PY

      - name: Set up DDEV
        uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: false
          version: 1.25.4

      - name: Start DDEV and install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          ddev start
          ddev composer validate --strict
          ddev composer install --no-interaction --prefer-dist
          ddev composer audit --locked

      - name: Reprove frozen V3 oracle before cloud inference
        shell: bash
        run: |
          set -euo pipefail
          ddev exec env             SIMPLETEST_DB=mysql://db:db@db/db             SIMPLETEST_BASE_URL=http://web             php scripts/activity-capture-benchmark-v3.php

      - name: Prove prompt schema and scorer parity and export semantic payload
        shell: bash
        run: |
          set -euo pipefail
          ddev exec env             SIMPLETEST_DB=mysql://db:db@db/db             SIMPLETEST_BASE_URL=http://web             PS_ACTIVITY_CAPTURE_V3_SEMANTIC_PAYLOAD=/tmp/ps170-v3-semantic-payload.json             PS_ACTIVITY_CAPTURE_V3_PARITY_RESULT=/tmp/ps170-v3-parity.json             php scripts/activity-capture-provider-v3.php parity
          ddev exec cat /tmp/ps170-v3-semantic-payload.json > "$RUNNER_TEMP/v3-semantic-payload.json"
          ddev exec cat /tmp/ps170-v3-parity.json > "$RUNNER_TEMP/v3-parity.json"
          python3 - "$RUNNER_TEMP/v3-parity.json" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1]))
          assert d["fixture_sha256"] == "bb31e0ba98db688adcdfd530275bf3aff47013c79d4c6bb2c4896b1477cc8cbd"
          assert d["prompt_parity_cases"] == 20
          assert d["system_prompt_parity"] == "PASS"
          assert d["user_prompt_parity_cases"] == 20
          assert d["schema_parity"] == "PASS"
          assert d["scorer_parity"] == "PASS"
          assert d["scorer_parity_fields"] == 320
          assert d["oracle_pass_cases"] == 20
          print("PROMPT_PARITY=PASS / 20 OF 20")
          print("SYSTEM_PROMPT_PARITY=PASS")
          print("USER_PROMPT_PARITY=PASS / 20 OF 20")
          print("SCHEMA_PARITY=PASS")
          print("SCORER_PARITY=PASS")
          PY

      - name: Execute exactly one Sol V3 tranche
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY_PRESENT=NO"
            exit 2
          fi
          echo "OPENAI_API_KEY_PRESENT=YES"
          python3 scripts/activity-capture-openai-v3.py             --model gpt-5.6-sol             --fixture web/modules/custom/personal_secretary/tests/fixtures/activity_capture_benchmark_v3.json             --semantic-payload "$RUNNER_TEMP/v3-semantic-payload.json"             --output "$RUNNER_TEMP/openai-sol-v3-raw.json"

      - name: Score Sol V3 through the real resolver
        id: score_sol
        shell: bash
        env:
          MINISTRAL_FINAL_CORRECT: ${{ inputs.ministral_final_correct }}
        run: |
          set -euo pipefail
          ddev exec sh -c 'cat > /tmp/ps170-openai-sol-v3-raw.json' < "$RUNNER_TEMP/openai-sol-v3-raw.json"
          ddev exec env             SIMPLETEST_DB=mysql://db:db@db/db             SIMPLETEST_BASE_URL=http://web             PS_ACTIVITY_CAPTURE_OPENAI_RAW_RESULT=/tmp/ps170-openai-sol-v3-raw.json             PS_ACTIVITY_CAPTURE_OPENAI_MODEL=gpt-5.6-sol             PS_ACTIVITY_CAPTURE_BENCHMARK_RESULT=/tmp/ps170-openai-sol-v3-result.json             php scripts/activity-capture-provider-v3.php score-openai
          ddev exec cat /tmp/ps170-openai-sol-v3-result.json > "$RUNNER_TEMP/openai-sol-v3-result.json"
          python3 - "$RUNNER_TEMP/openai-sol-v3-result.json" "$GITHUB_OUTPUT" <<'PY'
          import json, os, sys
          d=json.load(open(sys.argv[1]))
          s=d["summary"]
          advantage=int(s["final_product_outcome_correct_cases"])-int(os.environ["MINISTRAL_FINAL_CORRECT"])
          eligible=s["semantic_verdict"]=="PASS" and advantage>=2
          print(f"SOL_SCHEMA_VALID_CASES={s['schema_valid_cases']}")
          print(f"SOL_AI_FIELDS_CORRECT={s['ai_fields_correct']}/{s['ai_fields_total']}")
          print(f"SOL_FINAL_PRODUCT_OUTCOME_CORRECT_CASES={s['final_product_outcome_correct_cases']}")
          print(f"SOL_SEMANTIC_VERDICT={s['semantic_verdict']}")
          print(f"SOL_SYNCHRONOUS_LATENCY={s['synchronous_latency']}")
          print(f"SOL_PRODUCT_OUTCOME_ADVANTAGE_OVER_MINISTRAL={advantage}")
          with open(sys.argv[2], "a") as f:
              f.write(f"semantic_verdict={s['semantic_verdict']}\n")
              f.write(f"final_correct={s['final_product_outcome_correct_cases']}\n")
              f.write(f"advantage={advantage}\n")
              f.write(f"terra_eligible={'true' if eligible else 'false'}\n")
          PY
          sha256sum "$RUNNER_TEMP/openai-sol-v3-result.json"

      - name: Upload Sol V3 synthetic evidence
        uses: actions/upload-artifact@v4
        with:
          name: activity-capture-v3-openai-sol
          path: ${{ runner.temp }}/openai-sol-v3-result.json
          if-no-files-found: error
          retention-days: 30

      - name: Execute exactly one conditional Terra V3 tranche
        if: steps.score_sol.outputs.terra_eligible == 'true'
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY_PRESENT=NO"
            exit 2
          fi
          echo "OPENAI_API_KEY_PRESENT=YES"
          python3 scripts/activity-capture-openai-v3.py             --model gpt-5.6-terra             --fixture web/modules/custom/personal_secretary/tests/fixtures/activity_capture_benchmark_v3.json             --semantic-payload "$RUNNER_TEMP/v3-semantic-payload.json"             --output "$RUNNER_TEMP/openai-terra-v3-raw.json"

      - name: Score conditional Terra V3 through the real resolver
        if: steps.score_sol.outputs.terra_eligible == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ddev exec sh -c 'cat > /tmp/ps170-openai-terra-v3-raw.json' < "$RUNNER_TEMP/openai-terra-v3-raw.json"
          ddev exec env             SIMPLETEST_DB=mysql://db:db@db/db             SIMPLETEST_BASE_URL=http://web             PS_ACTIVITY_CAPTURE_OPENAI_RAW_RESULT=/tmp/ps170-openai-terra-v3-raw.json             PS_ACTIVITY_CAPTURE_OPENAI_MODEL=gpt-5.6-terra             PS_ACTIVITY_CAPTURE_BENCHMARK_RESULT=/tmp/ps170-openai-terra-v3-result.json             php scripts/activity-capture-provider-v3.php score-openai
          ddev exec cat /tmp/ps170-openai-terra-v3-result.json > "$RUNNER_TEMP/openai-terra-v3-result.json"
          sha256sum "$RUNNER_TEMP/openai-terra-v3-result.json"

      - name: Upload conditional Terra V3 synthetic evidence
        if: steps.score_sol.outputs.terra_eligible == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: activity-capture-v3-openai-terra
          path: ${{ runner.temp }}/openai-terra-v3-result.json
          if-no-files-found: error
          retention-days: 30

      - name: Record Terra ineligibility
        if: steps.score_sol.outputs.terra_eligible != 'true'
        shell: bash
        run: |
          echo "OPENAI_TERRA_ARM_EXECUTED=NO"
          echo "SOL_SEMANTIC_VERDICT=${{ steps.score_sol.outputs.semantic_verdict }}"
          echo "SOL_PRODUCT_OUTCOME_ADVANTAGE_OVER_MINISTRAL=${{ steps.score_sol.outputs.advantage }}"
