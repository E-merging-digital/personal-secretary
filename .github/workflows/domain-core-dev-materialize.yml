name: Materialize domain core test tooling

on:
  push:
    branches:
      - "work/issue-37-domain-core-entities"

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch HEAD
        uses: actions/checkout@v5
        with:
          ref: work/issue-37-domain-core-entities

      - name: Set up DDEV
        uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: false
          version: 1.25.4

      - name: Start DDEV
        run: ddev start

      - name: Resolve Drupal core development test tooling
        run: ddev composer require --dev drupal/core-dev:11.4.5 --with-all-dependencies --no-interaction

      - name: Persist resolved Composer files on bounded branch
        run: |
          set -euo pipefail
          if git diff --quiet -- composer.json composer.lock; then
            echo "Composer files already materialized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.json composer.lock
          git commit -m "Materialize Drupal Kernel test tooling (#37)"
          git push origin HEAD:work/issue-37-domain-core-entities
