name: Drupal

on:
  push:
    branches:
      - "work/**"

permissions:
  contents: read

jobs:
  drupal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact HEAD
        uses: actions/checkout@v5

      - name: Assert committed lock
        run: test -f composer.lock

      - name: Set up DDEV
        uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: false
          version: 1.25.4

      - name: Assert DEV-only shared configuration isolation
        run: |
          ! grep -Eq '^[[:space:]]+(devel|security_review):' config/sync/core.extension.yml

      - name: Start DDEV
        run: |
          ddev version
          ddev start
          ddev describe

      - name: Validate locked Composer project
        run: |
          ddev composer validate --strict
          ddev composer install --no-interaction --prefer-dist
          ddev composer audit --locked

      - name: Bootstrap development baseline
        run: |
          ddev exec ./scripts/bootstrap development
          ddev exec ./scripts/verify development

      - name: Verify private DEV Host admission with synthetic DDEV only
        shell: bash
        run: |
          set -euo pipefail
          ddev exec php scripts/verify-dev-private-host.php
          target='http://127.0.0.1/fr/personal-secretary/calendar/google'
          for item in             'personal-secretary.ddev.site:403'             'ps-dev.internal.emergingdigital.be:403'             'unrelated.invalid:404'; do
            host="${item%:*}"
            expected="${item##*:}"
            actual="$(curl --noproxy '*' --silent --show-error --max-time 15 --output /dev/null --write-out '%{http_code}' -H "Host: ${host}" "${target}")"
            if [[ "${actual}" != "${expected}" ]]; then
              printf 'PRIVATE_DEV_HOST_ROUTER=STOP Host=%s expected=%s actual=%s\n' "${host}" "${expected}" "${actual}" >&2
              exit 1
            fi
          done
          echo 'PRIVATE_DEV_HOST_ROUTER=PASS'

      - name: Run Personal Secretary domain and browser tests
        run: |
          ddev exec env SIMPLETEST_DB=mysql://db:db@db/db SIMPLETEST_BASE_URL=http://web vendor/bin/phpunit -c web/core/phpunit.xml.dist web/modules/custom/personal_secretary/tests/src

      - name: Prove bilingual existing-install transition
        run: ddev exec ./scripts/prove-bilingual-existing-install

      - name: Run Date Recur recurrence spike explicitly
        run: ddev exec vendor/bin/drush php:script scripts/date-recur-spike.php

      - name: Clean rebuild 1
        run: ddev exec ./scripts/rebuild development

      - name: Clean rebuild 2
        run: ddev exec ./scripts/rebuild development

      - name: Prove production no-dev trajectory and generic verification
        run: |
          rm -rf vendor web/core web/modules/contrib web/profiles/contrib web/themes/contrib
          ddev composer install --no-dev --no-interaction --prefer-dist
          ddev exec ./scripts/rebuild production
          ddev exec ./scripts/verify production

      - name: Assert repository drift is zero
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
