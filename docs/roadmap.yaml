current_goal:
  phase: personal-prod-readiness
  purpose: >-
    Materialize the application/runtime contract for a private daily-use Personal
    Secretary production, then complete the minimum product and infrastructure
    gates required for a recoverable first usable PROD.

active_tasks:
  - issue: 140
    purpose: >-
      Document the private PROD application contract, DEV/PROD boundaries,
      persistent-data and secret requirements, reminder scheduler safety, and
      rebaseline this roadmap without implementing Infrastructure.

