schema_version: 1

# Planning intent only. GitHub remains the live execution truth.
# Do not store live issue state, PR numbers, commit SHAs, CI state or merge state.

current_goal:
  epic: 1
  purpose: >-
    Establish the minimal agent-native governance and deterministic PR path
    before any Drupal implementation.

active_tasks:
  - issue: 4
    purpose: >-
      Materialize the repository governance foundation and return the first
      trust-root PR to Project Lead before merge.

planned_tasks:
  - issue: 5
    purpose: >-
      Materialize and prove the smallest useful deterministic CI, then configure
      main protection/ruleset and prove the PR-only path.
    depends_on:
      - 4

  - issue: 6
    purpose: >-
      Prove one bounded synthetic issue-to-branch/worktree-to-PR delivery path
      with exact-head evidence and independent Project Lead review.
    depends_on:
      - 5

  - issue: 7
    purpose: >-
      Keep the execution capability registry accurate and define the future
      self-hosted trajectory without representing unproven capabilities as
      available.
    depends_on:
      - 5

deferred_decisions:
  - issue: 8
    purpose: >-
      Decide repository licensing before substantive functional publication,
      including implications of building on Drupal.
