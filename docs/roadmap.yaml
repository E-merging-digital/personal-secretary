execution_sequence:
  - >-
    Complete #140 and merge only after Project Lead authorization.
  - >-
    Develop #126 in canonical DEV while Infrastructure progresses the PROD runtime,
    private access, backup and recovery work.
  - >-
    Infrastructure performs the controlled PROD restore only after runtime and
    recovery boundaries are documented.
  - >-
    Execute #141 to validate the restored product and inventory reminder delivery
    state before scheduler activation.
  - >-
    Perform the separately authorized real SMTP-provider proof and deliberately
    activate reminder scheduling.
  - >-
    Accept the first usable private PROD, then resume broader integrations such as #84.

dependency_re_evaluation:
