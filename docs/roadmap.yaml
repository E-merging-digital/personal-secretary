current_goal:
  phase: personalized-current-user-upcoming
  purpose: >-
    Give the authenticated Drupal account a personalized Upcoming view filtered
    only by effective responsibility for its exact CurrentPerson identity, while
    preserving the existing Household-wide Upcoming surface.

