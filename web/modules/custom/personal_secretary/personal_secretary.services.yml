services:
  personal_secretary.occurrence_projection:
    class: Drupal\personal_secretary\Service\OccurrenceProjectionService

  personal_secretary.revision_timeline:
    class: Drupal\personal_secretary\Service\RevisionTimelineService
    arguments: ['@entity_type.manager', '@personal_secretary.occurrence_projection']

  personal_secretary.activity_exception:
    class: Drupal\personal_secretary\Service\ActivityExceptionService
    arguments: ['@entity_type.manager', '@personal_secretary.revision_timeline', '@datetime.time']

  personal_secretary.effective_occurrence_projection:
    class: Drupal\personal_secretary\Service\EffectiveOccurrenceProjectionService
    arguments: ['@personal_secretary.revision_timeline', '@personal_secretary.activity_exception']

  personal_secretary.responsibility_context_validator:
    class: Drupal\personal_secretary\Service\ResponsibilityContextValidator
    arguments: ['@entity_type.manager', '@personal_secretary.effective_occurrence_projection']

  personal_secretary.responsibility_mutation:
    class: Drupal\personal_secretary\Service\ResponsibilityMutationService
    arguments: ['@entity_type.manager', '@personal_secretary.responsibility_context_validator', '@datetime.time']

  personal_secretary.current_recurring_responsibility:
    class: Drupal\personal_secretary\Service\CurrentRecurringResponsibilityResolver
    arguments:
      - '@entity_type.manager'
      - '@personal_secretary.responsibility_context_validator'
      - '@personal_secretary.occurrence_projection'

  personal_secretary.effective_responsibility:
    class: Drupal\personal_secretary\Service\EffectiveResponsibilityService
    arguments: ['@entity_type.manager', '@personal_secretary.responsibility_context_validator']

  personal_secretary.time_commitment_mutation:
    class: Drupal\personal_secretary\Service\TimeCommitmentMutationService
    arguments: ['@entity_type.manager', '@datetime.time']

  personal_secretary.time_commitment:
    class: Drupal\personal_secretary\Service\TimeCommitmentResolver
    arguments: ['@entity_type.manager']

  personal_secretary.calendar_eligibility:
    class: Drupal\personal_secretary\Service\CalendarEligibilityService
    arguments:
      - '@personal_secretary.effective_responsibility'
      - '@personal_secretary.time_commitment'
      - '@entity_type.manager'

  personal_secretary.edit_time_commitment:
    class: Drupal\personal_secretary\Service\EditTimeCommitmentService
    arguments:
      - '@entity_type.manager'
      - '@datetime.time'
      - '@personal_secretary.effective_occurrence_projection'
      - '@personal_secretary.time_commitment'
      - '@personal_secretary.time_commitment_mutation'

  personal_secretary.preparation_requirement_mutation:
    class: Drupal\personal_secretary\Service\PreparationRequirementMutationService
    arguments: ['@entity_type.manager', '@personal_secretary.responsibility_context_validator', '@datetime.time']

  personal_secretary.preparation_eligibility:
    class: Drupal\personal_secretary\Service\PreparationEligibilityService
    arguments: ['@entity_type.manager', '@personal_secretary.effective_responsibility']

  personal_secretary.upcoming_activity:
    class: Drupal\personal_secretary\Service\UpcomingActivityService
    arguments:
      - '@entity_type.manager'
      - '@personal_secretary.effective_occurrence_projection'
      - '@personal_secretary.effective_responsibility'
      - '@personal_secretary.preparation_eligibility'
      - '@datetime.time'

  personal_secretary.current_person:
    class: Drupal\personal_secretary\Service\CurrentPersonResolver
    arguments: ['@entity_type.manager']

  personal_secretary.household_authorization:
    class: Drupal\personal_secretary\Service\HouseholdAuthorizationService
    arguments: ['@entity_type.manager']

  personal_secretary.manage_household_authorization:
    class: Drupal\personal_secretary\Service\ManageHouseholdAuthorizationService
    arguments:
      - '@entity_type.manager'
      - '@current_user'

  personal_secretary.personal_task_mutation:
    class: Drupal\personal_secretary\Service\PersonalTaskMutationService
    arguments:
      - '@entity_type.manager'
      - '@current_user'
      - '@personal_secretary.household_authorization'
      - '@personal_secretary.current_person'
      - '@datetime.time'
      - '@config.factory'

  personal_secretary.personal_task_query:
    class: Drupal\personal_secretary\Service\PersonalTaskQueryService
    arguments:
      - '@entity_type.manager'
      - '@current_user'
      - '@personal_secretary.household_authorization'
      - '@personal_secretary.current_person'
      - '@datetime.time'
      - '@config.factory'

  personal_secretary.today:
    class: Drupal\personal_secretary\Service\TodayService
    arguments:
      - '@entity_type.manager'
      - '@current_user'
      - '@personal_secretary.household_authorization'
      - '@personal_secretary.current_person'
      - '@personal_secretary.personal_task_query'
      - '@personal_secretary.effective_occurrence_projection'
      - '@personal_secretary.effective_responsibility'
      - '@datetime.time'
      - '@config.factory'

  personal_secretary.product_use_access:
    class: Drupal\personal_secretary\Access\ProductUseAccessCheck
    arguments: ['@personal_secretary.household_authorization']
    tags:
      - { name: access_check, applies_to: _personal_secretary_product_access }

  personal_secretary.link_current_user_to_person:
    class: Drupal\personal_secretary\Service\LinkCurrentUserToPersonService
    arguments:
      - '@entity_type.manager'
      - '@current_user'

  personal_secretary.domain_mutation:
    class: Drupal\personal_secretary\Service\DomainMutationService
    arguments: ['@entity_type.manager', '@database', '@personal_secretary.activity_exception']

  personal_secretary.add_household_member:
    class: Drupal\personal_secretary\Service\AddHouseholdMemberService
    arguments:
      - '@entity_type.manager'
      - '@database'
      - '@personal_secretary.domain_mutation'

  personal_secretary.rename_household_member:
    class: Drupal\personal_secretary\Service\RenameHouseholdMemberService
    arguments:
      - '@entity_type.manager'
      - '@personal_secretary.domain_mutation'

  personal_secretary.first_activity_setup:
    class: Drupal\personal_secretary\Service\FirstActivitySetupService
    arguments:
      - '@database'
      - '@personal_secretary.domain_mutation'
      - '@personal_secretary.responsibility_mutation'
      - '@personal_secretary.preparation_requirement_mutation'

  personal_secretary.add_activity:
    class: Drupal\personal_secretary\Service\AddActivityService
    arguments:
      - '@database'
      - '@personal_secretary.domain_mutation'
      - '@personal_secretary.responsibility_mutation'
      - '@personal_secretary.preparation_requirement_mutation'

  personal_secretary.edit_recurring_schedule:
    class: Drupal\personal_secretary\Service\EditRecurringScheduleService
    arguments:
      - '@database'
      - '@datetime.time'
      - '@personal_secretary.domain_mutation'
      - '@personal_secretary.responsibility_mutation'
      - '@personal_secretary.current_recurring_responsibility'

  personal_secretary.edit_recurring_responsibility:
    class: Drupal\personal_secretary\Service\EditRecurringResponsibilityService
    arguments:
      - '@database'
      - '@datetime.time'
      - '@personal_secretary.current_recurring_responsibility'
      - '@personal_secretary.responsibility_context_validator'
      - '@personal_secretary.occurrence_projection'
      - '@personal_secretary.responsibility_mutation'

  personal_secretary.original_occurrence_target_resolver:
    class: Drupal\personal_secretary\Service\OriginalOccurrenceTargetResolver
    arguments:
      - '@entity_type.manager'
      - '@personal_secretary.revision_timeline'
      - '@personal_secretary.occurrence_projection'

  personal_secretary.occurrence_target_resolver:
    class: Drupal\personal_secretary\Service\OccurrenceTargetResolver
    arguments:
      - '@personal_secretary.original_occurrence_target_resolver'
      - '@personal_secretary.effective_occurrence_projection'

  personal_secretary.current_effective_occurrence_resolver:
    class: Drupal\personal_secretary\Service\CurrentEffectiveOccurrenceResolver
    arguments:
      - '@personal_secretary.original_occurrence_target_resolver'
      - '@personal_secretary.activity_exception'
      - '@personal_secretary.effective_occurrence_projection'

  personal_secretary.cancel_occurrence:
    class: Drupal\personal_secretary\Service\CancelOccurrenceService
    arguments:
      - '@personal_secretary.occurrence_target_resolver'
      - '@personal_secretary.activity_exception'

  personal_secretary.reschedule_occurrence:
    class: Drupal\personal_secretary\Service\RescheduleOccurrenceService
    arguments:
      - '@personal_secretary.occurrence_target_resolver'
      - '@personal_secretary.activity_exception'

  personal_secretary.occurrence_responsibility:
    class: Drupal\personal_secretary\Service\OccurrenceResponsibilityService
    arguments:
      - '@personal_secretary.current_effective_occurrence_resolver'
      - '@personal_secretary.effective_responsibility'
      - '@personal_secretary.responsibility_mutation'
      - '@entity_type.manager'
