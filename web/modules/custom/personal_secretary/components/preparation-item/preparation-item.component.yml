$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Preparation item
status: stable
props:
  type: object
  required:
    - instruction
    - due_time
    - due_time_iso
    - overdue
    - activity_label
    - all_day
    - all_day_start_date
    - all_day_end_date
    - all_day_start_label
    - all_day_end_label
    - activity_start
    - activity_start_iso
    - display_timezone
  properties:
    instruction:
      type: string
      title: Preparation instruction
    due_time:
      type: string
      title: Viewer-local due display
    due_time_iso:
      type: string
      title: Viewer-local due ISO datetime
    overdue:
      type: boolean
      title: Whether the preparation due instant has passed
    activity_label:
      type: string
      title: Related activity label
    all_day:
      type: boolean
      title: Whether the related effective occurrence is all-day
    all_day_start_date:
      type: string
      title: Effective all-day start civil date
    all_day_end_date:
      type: string
      title: Effective all-day inclusive end civil date
    all_day_start_label:
      type: string
      title: Localized all-day start date
    all_day_end_label:
      type: string
      title: Localized all-day inclusive end date
    activity_start:
      type: string
      title: Viewer-local timed activity start display
    activity_start_iso:
      type: string
      title: Viewer-local activity start ISO datetime
    display_timezone:
      type: string
      title: Current User display timezone
