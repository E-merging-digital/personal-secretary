$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Today activity
status: stable
props:
  type: object
  required:
    - activity_label
    - all_day
    - all_day_start_date
    - all_day_end_date
    - effective_start
    - effective_end
    - effective_start_iso
    - effective_end_iso
    - display_timezone
    - source_timezone
  properties:
    activity_label:
      type: string
      title: Activity label
    location:
      type: string
      title: Optional activity location
    concerned_person_labels:
      type: array
      title: Concerned Person labels
      items:
        type: string
    all_day:
      type: boolean
      title: Whether the activity uses all-day civil-date semantics
    all_day_start_date:
      type: string
      title: Source-local all-day start date
    all_day_end_date:
      type: string
      title: Source-local inclusive all-day end date
    effective_start:
      type: string
      title: Viewer-local effective start display
    effective_end:
      type: string
      title: Viewer-local effective end display
    effective_start_iso:
      type: string
      title: Viewer-local effective start ISO datetime
    effective_end_iso:
      type: string
      title: Viewer-local effective end ISO datetime
    display_timezone:
      type: string
      title: Current User display timezone
    source_timezone:
      type: string
      title: Activity source timezone
