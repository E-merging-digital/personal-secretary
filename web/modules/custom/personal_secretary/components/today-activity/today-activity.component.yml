$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Today activity
status: stable
props:
  type: object
  required:
    - activity_label
    - effective_start
    - effective_end
    - effective_start_iso
    - effective_end_iso
    - display_timezone
  properties:
    activity_label:
      type: string
      title: Activity label
    effective_start:
      type: string
      title: Viewer-local effective start display
    effective_end:
      type: string
      title: Viewer-local effective end display
    effective_start_iso:
      type: string
      title: Viewer-local effective start ISO datetime
    effective_end_iso:
      type: string
      title: Viewer-local effective end ISO datetime
    display_timezone:
      type: string
      title: Current User display timezone
