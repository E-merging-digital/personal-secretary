personal_secretary.upcoming:
  path: '/personal-secretary/upcoming'
  defaults:
    _controller: '\Drupal\personal_secretary\Controller\UpcomingController::build'
    _title: 'Upcoming activities and preparations'
  requirements:
    _permission: 'administer personal secretary domain'

personal_secretary.setup:
  path: '/personal-secretary/setup'
  defaults:
    _form: '\Drupal\personal_secretary\Form\FirstActivitySetupForm'
    _title: 'Set up your first activity'
  requirements:
    _permission: 'administer personal secretary domain'

personal_secretary.add_activity:
  path: '/personal-secretary/activities/add'
  defaults:
    _form: '\Drupal\personal_secretary\Form\AddActivityForm'
    _title: 'Add activity'
  requirements:
    _permission: 'administer personal secretary domain'

personal_secretary.add_household_member:
  path: '/personal-secretary/households/members/add'
  defaults:
    _form: '\Drupal\personal_secretary\Form\AddHouseholdMemberForm'
    _title: 'Add household member'
  requirements:
    _permission: 'administer personal secretary domain'

personal_secretary.rename_household_member:
  path: '/personal-secretary/households/members/rename'
  defaults:
    _form: '\Drupal\personal_secretary\Form\RenameHouseholdMemberForm'
    _title: 'Rename household member'
  requirements:
    _permission: 'administer personal secretary domain'

personal_secretary.edit_recurring_schedule:
  path: '/personal-secretary/activities/{series}/schedule/edit'
  defaults:
    _form: '\Drupal\personal_secretary\Form\EditRecurringScheduleForm'
    _title: 'Change recurring schedule'
  requirements:
    _permission: 'administer personal secretary domain'
    series: '\d+'

personal_secretary.edit_recurring_responsibility:
  path: '/personal-secretary/activities/{series}/responsibility/edit'
  defaults:
    _form: '\Drupal\personal_secretary\Form\EditRecurringResponsibilityForm'
    _title: 'Change recurring responsibility'
  requirements:
    _permission: 'administer personal secretary domain'
    series: '\d+'

personal_secretary.responsibility_occurrence:
  path: '/personal-secretary/activities/{series}/occurrences/{original_occurrence_key}/responsibility'
  defaults:
    _form: '\Drupal\personal_secretary\Form\OccurrenceResponsibilityForm'
    _title: 'Change responsibility'
  requirements:
    _permission: 'administer personal secretary domain'
    series: '\d+'
    original_occurrence_key: '[^/]+'

personal_secretary.reschedule_occurrence:
  path: '/personal-secretary/activities/{series}/occurrences/{original_occurrence_key}/reschedule'
  defaults:
    _form: '\Drupal\personal_secretary\Form\RescheduleOccurrenceForm'
    _title: 'Reschedule occurrence'
  requirements:
    _permission: 'administer personal secretary domain'
    series: '\d+'
    original_occurrence_key: '[^/]+'

personal_secretary.cancel_occurrence:
  path: '/personal-secretary/activities/{series}/occurrences/{original_occurrence_key}/cancel'
  defaults:
    _form: '\Drupal\personal_secretary\Form\CancelOccurrenceForm'
    _title: 'Cancel occurrence'
  requirements:
    _permission: 'administer personal secretary domain'
    series: '\d+'
    original_occurrence_key: '[^/]+'
