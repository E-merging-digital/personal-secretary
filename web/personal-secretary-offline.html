<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1b9ae4">
  <title>Personal Secretary — Offline</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      box-sizing: border-box;
    }
    main {
      max-width: 34rem;
      text-align: center;
    }
    h1 {
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Personal Secretary</h1>
    <p data-lang="en">Personal Secretary is offline.</p>
    <p data-lang="en">Reconnect to access your information.</p>
    <p data-lang="fr" hidden>Personal Secretary est hors ligne.</p>
    <p data-lang="fr" hidden>Reconnectez-vous pour accéder à vos informations.</p>
  </main>
  <script>
    (() => {
      const language = (navigator.language || 'en').toLowerCase().startsWith('fr')
        ? 'fr'
        : 'en';
      document.documentElement.lang = language;
      document.querySelectorAll('[data-lang]').forEach((element) => {
        element.hidden = element.dataset.lang !== language;
      });
    })();
  </script>
</body>
</html>
